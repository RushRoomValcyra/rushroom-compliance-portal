<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- The portal moved to Netlify (2026-10-27): old github.io links, bookmarks and emails forward there. -->
  <script>if (location.hostname.endsWith("github.io")) location.replace("https://engineeringcompliance.netlify.app" + location.pathname.replace(/^\/rushroom-compliance-portal/, "") + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier portal · Rushroom Engineering &amp; Compliance Platform</title>
  <meta name="description" content="Supplier portal: released drawings and CAD for the parts a supplier makes for Rushroom AB, supplier documents and standards." />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=67" />
  <meta name="theme-color" content="#12161e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#2fa564" media="(prefers-color-scheme: light)" />
  <script>
    (function () { try { var t = localStorage.getItem("rushroom_theme"); if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="./assets/styles.css?v=477" />
  <!-- Online3DViewer: in-browser STEP + GLB preview (CAD Models tab) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/online-3d-viewer@0.18.0/build/engine/o3dv.min.css" />
</head>
<body data-page="supplier">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5c0 4.6-3.1 7.7-7 9-3.9-1.3-7-4.4-7-9V6l7-3z"/><path d="M9 12l2.2 2.2L15.5 10"/>
          </svg>
        </span>
        <div class="brand-text">
          <span class="badge">Rushroom AB · Supplier portal</span>
          <h1 id="supplier-name">Supplier portal</h1>
          <p class="tagline" id="supplier-user"></p>
        </div>
      </div>
      <div class="header-tools">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme"></button>
        <nav aria-label="Session" id="session-actions" class="session-actions"></nav>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">
    <section id="gate" class="gate" aria-labelledby="gate-title">
      <div class="gate-card">
        <h2 id="gate-title" style="margin-bottom:1.25rem">Supplier sign-in</h2>
        <form id="gate-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="username"
                   aria-invalid="false" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password"
                   aria-invalid="false" aria-describedby="gate-error" required />
          </div>
          <div class="field" id="login-mfa-field" hidden>
            <label for="login-mfa">Authenticator code</label>
            <input id="login-mfa" name="mfa" type="text" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="6" aria-invalid="false" />
          </div>
          <p id="gate-error" class="form-error" role="alert" aria-live="assertive"></p>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <div class="gate-links">
          <button class="linklike" id="forgot-password" type="button">Forgot password?</button>
          <span id="gate-note" class="muted" style="margin-left:0.6rem"></span>
        </div>
      </div>
    </section>

    <div id="portal-app" hidden>
      <div class="tabs" id="tablist" role="tablist" aria-label="Supplier sections">
        <button class="tab" id="tab-parts" role="tab" aria-selected="true"
                aria-controls="parts-panel" tabindex="0">Parts &amp; files</button>
        <button class="tab" id="tab-documents" role="tab" aria-selected="false"
                aria-controls="documents-panel" tabindex="-1">Supplier Documents</button>
        <button class="tab" id="tab-standards" role="tab" aria-selected="false"
                aria-controls="standards-panel" tabindex="-1">Standards &amp; Regulations</button>
      </div>

      <section id="steps-panel" hidden aria-hidden="true"></section>

      <section id="parts-panel" role="tabpanel" aria-labelledby="tab-parts" tabindex="0">
        <div class="loading">Loading parts…</div>
      </section>

      <section id="documents-panel" role="tabpanel" aria-labelledby="tab-documents" tabindex="0" hidden>
        <div class="loading">Loading documents…</div>
      </section>

      <section id="standards-panel" role="tabpanel" aria-labelledby="tab-standards" tabindex="0" hidden>
        <div class="loading">Loading standards…</div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">Rushroom AB · Supplier portal</div>
  </footer>

  <script src="./assets/config.js?v=310"></script>
  <script src="./assets/api.js?v=432"></script>
  <script src="./assets/viewer.js?v=477"></script>
  <script src="./assets/bom-structure.js?v=310"></script>
  <script src="https://cdn.jsdelivr.net/npm/online-3d-viewer@0.18.0/build/engine/o3dv.min.js"></script>
  <script src="./assets/app.js?v=477"></script>
  <script src="./assets/supplier.js?v=461"></script>
</body>
</html>
